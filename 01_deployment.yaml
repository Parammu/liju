apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-dpt
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
        env: dev
    spec:
      containers:
        - name: nginx-container
          image: nginx:1.28.1-alpine3.23 