
## Demo: DaemonSet - Deploying a Dummy Logging Agent

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-collector
  namespace: log-ns
  labels:
    app: log-collector
spec:
  selector:
    matchLabels:
      app: log-collector
  template:
    metadata:
      labels:
        app: log-collector
    spec:
      containers:
        - name: log-collector
          image: fluent/fluent-bit:3.0
          resources:
            requests:
              cpu: "50m"
              memory: "50Mi"
            limits:
              cpu: "100m"
              memory: "100Mi"